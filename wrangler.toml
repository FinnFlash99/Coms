# Cloudflare Workers configuration for Coms
name = "coms"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_als"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "coms-db"
database_id = "fc100fdf-8a6e-47c7-832c-325ea57e03a0"

# KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "8c2d31fbf05145f5807cca06b252ab67"

[[kv_namespaces]]
binding = "OAUTH_STATE"
id = "84099b06344b4125a95b07d57a87dc4a"

# Queues (for background sync)
# [[queues.producers]]
# binding = "SYNC_QUEUE"
# queue = "coms-sync"

# Environment variables (secrets should be set via wrangler secret)
[vars]
ENVIRONMENT = "development"
